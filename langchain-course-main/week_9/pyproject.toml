[project]
name = "my_agent_project"
version = "0.1.0"
dependencies = [
    "mcp>=1.0.0",
    "langchain",
    "langchain-community<0.4.0",
    "langchain-openai",
    "langchain-text-splitters",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pgvector",
    "psycopg",
    "psycopg2-binary",
    "python-dotenv",
    "pypdf",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "langchain-google-genai>=1.0.0",
    "streamlit",
    "ragas>=0.2.12",
    "langchain-google-vertexai",
    "google-cloud-aiplatform",
    "trulens-core",
    "trulens-apps-langchain",
    "trulens-providers-openai",
    "nemoguardrails",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["."]