[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_agent_project"
version = "0.1.0"
dependencies = [
    "langchain",
    "langchain_community",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-postgres",  # 👈 Add this line here
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pgvector",
    "psycopg",
    "psycopg2-binary",
    "python-dotenv",
    "pypdf",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "langchain-google-genai>=1.0.0",
    "streamlit"
]

# 👇 Add this section for Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["."]